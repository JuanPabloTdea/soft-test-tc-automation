name: Require PR Reviews

on:
  pull_request:
    branches: [main, master, develop]

jobs:
  require-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR has reviews
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('No PR context available');
              return;
            }

            const owner = pr.user.login;
            const repo = context.repo.repo;
            const prNumber = pr.number;

            const requiredReviewers = ['JuanPabloTdea'];

            if (owner === requiredReviewers[0]) {
              console.log('PR author is owner, skipping review requirement');
              return;
            }

            const isFork = pr.head.repo.fork;

            if (isFork || !requiredReviewers.includes(owner)) {
              const reviews = await github.rest.pulls.listReviews({
                owner,
                repo,
                pull_number: prNumber
              });

              if (reviews.data.length === 0) {
                core.setFailed('This PR requires at least one review before merging. Please request a review from a maintainer.');
              }

              const approvedReviews = reviews.data.filter(r => r.state === 'APPROVED');
              if (approvedReviews.length === 0) {
                core.setFailed('This PR needs at least one approval before merging.');
              }
            }

  cypress-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install
      - run: pnpm exec cypress run
